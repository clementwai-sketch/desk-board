  "sector_rotation_html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"/>\n\u003c!-- Sector Rotation shell. Plug data with:\n     python3 scripts/plug_sector_rotation.py --data Dashboard/sector_rotation_YYYY-MM-DD.json --out Dashboard/Sector_Rotation_YYYY-MM-DD.html\n     Data schema: Dashboard/sector_rotation_example.json. Set \"sample_fields\": [] once d5/hist are real.\n     Rotation map is an arrow chart: one row per ETF sorted by d5, arrow from RS21 five sessions ago\n     (rs21 - d5) to today, faint dots from hist[][0]. Shaded rows = rotating in (below 60 and d5 >= +10,\n     or just crossed 60). Everything between START_DATA / END_DATA is replaced by the plug script. -->\n\u003ctitle>Sector Rotation\u003c/title>\n\u003cstyle>\n:root{\n  font-size:19px;\n  color-scheme:dark;\n  --bg:#0c1016; --surface:#141a22; --surface-2:#1a212b; --ink:#e9edf2; --ink-2:#b4bdc9; --muted:#7f8a98;\n  --grid:#222a35; --axis:#344050; --ring:rgba(255,255,255,.10);\n  --lead:#199e70; --weak:#c98500; --impr:#9085e9; --lag:#6b7480;\n  --lead-bg:rgba(25,158,112,.09); --weak-bg:rgba(201,133,0,.08); --impr-bg:rgba(144,133,233,.08); --lag-bg:rgba(107,116,128,.10);\n  --in:#f87171; --out:#4ade80; --focus:#3987e5; --hi:rgba(144,133,233,.14);\n  --sans:\"Noto Sans CJK TC\", \"SamsungOneUI\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n:root[data-theme=\"light\"]{\n  color-scheme:light;\n  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#10151c; --ink-2:#465160; --muted:#6d7785;\n  --grid:#e3e7ec; --axis:#c3cad3; --ring:rgba(16,21,28,.10);\n  --lead:#1baf7a; --weak:#c98500; --impr:#4a3aa7; --lag:#8a929d;\n  --lead-bg:rgba(27,175,122,.07); --weak-bg:rgba(201,133,0,.07); --impr-bg:rgba(74,58,167,.06); --lag-bg:rgba(138,146,157,.08);\n  --in:#dc2626; --out:#15803d; --focus:#2a78d6; --hi:rgba(74,58,167,.10);\n}\n*{box-sizing:border-box}\n.wrap *{min-width:0}\nbody{overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.45;margin:0}\n.wrap{width:100%;max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;gap:18px}\nheader{display:grid;gap:6px}\n.eyebrow{font-family:var(--sans);font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}\nh1{font-family:var(--sans);font-weight:700;font-size:2rem;line-height:1.1;margin:0;text-wrap:balance}\nh2{font-family:var(--sans);font-weight:600;font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}\n.sample{font-size:19px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;max-width:70ch}\n.sample b{color:var(--ink)}\n.num{font-family:var(--sans);font-variant-numeric:tabular-nums}\n.panel{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--ring);padding:14px}\n.stack{display:grid;gap:10px}\n.cols{display:grid;gap:18px}\n@media (min-width:1000px){ .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start} }\n\n/* quadrant summary: laid out like the map */\n.quads{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}\n@media (max-width:639px){ .quads{grid-template-columns:minmax(0,1fr)} }\n.quad{border-radius:10px;padding:10px 11px;display:grid;gap:4px;align-content:start}\n.quad .qh{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:600;font-size:19px}\n.quad .qh .n{margin-left:auto;font-family:var(--sans);font-size:19px;color:var(--muted);font-weight:500}\n.quad .qd{font-size:19px;color:var(--muted)}\n.quad .tk{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:var(--sans);font-size:19px;font-weight:600}\n.q-lead{background:var(--lead-bg)} .q-weak{background:var(--weak-bg)} .q-impr{background:var(--impr-bg)} .q-lag{background:var(--lag-bg)}\n.sw{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--surface)}\n.sw.lead{background:var(--lead)} .sw.weak{background:var(--weak)} .sw.impr{background:var(--impr)} .sw.lag{background:var(--lag)}\n\n/* map */\n.map{position:relative}\n.map svg{display:block;width:100%;height:auto;touch-action:manipulation}\n.map .dot{cursor:pointer}\n.map .dot:focus{outline:none}\n.map .dot:focus-visible circle.m{stroke:var(--focus);stroke-width:3}\n.sw.hi{border-radius:3px;background:var(--hi);box-shadow:0 0 0 1px var(--impr)}\n.tip{position:absolute;z-index:2;width:280px;max-width:100%;background:var(--surface);color:var(--ink);border-radius:10px;\n  box-shadow:0 0 0 1px var(--ring),0 8px 24px rgba(0,0,0,.18);padding:9px 11px;font-size:19px;pointer-events:none}\n.tip .t1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}\n.tip dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0 0}\n.tip dt{color:var(--muted)} .tip dd{margin:0;text-align:right;font-family:var(--sans)}\n.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:19px;color:var(--ink-2)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.caption{font-size:19px;color:var(--muted)}\n\n/* flow list */\n.sorts{display:flex;gap:6px;flex-wrap:wrap}\n.sorts button{font:500 19px var(--sans);color:var(--ink-2);background:var(--surface-2);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}\n.sorts button[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg)}\n.sorts button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}\n.rows{display:grid;container-type:inline-size}\n.flowbox{container-type:inline-size}\n.row{display:grid;grid-template-columns:minmax(0,1.3fr) 92px 80px minmax(0,1.2fr);grid-template-areas:\"id rs d cmf\" \"id tag tag tag\";\n  gap:2px 10px;align-items:center;padding:9px 6px;border-top:1px solid var(--grid);cursor:pointer;border-radius:6px}\n.row:first-child{border-top:0}\n.row:hover{background:var(--surface-2)}\n.row.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--focus)}\n.row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}\n.row .id{grid-area:id;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:center}\n.row .id .sw{grid-row:span 2}\n.row .etf{font-family:var(--sans);font-weight:600;font-size:16px}\n.row .sec{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .rs{grid-area:rs;display:grid;gap:3px}\n.row .rs .v{font-family:var(--sans);font-size:16px}\n.bar{height:4px;border-radius:2px;background:var(--grid);position:relative;overflow:hidden}\n.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--ink-2)}\n.row .d{grid-area:d;font-family:var(--sans);font-size:16px;text-align:right;white-space:nowrap}\n.row .cmf{grid-area:cmf;display:grid;gap:3px}\n.row .cmf .v{font-family:var(--sans);font-size:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}\n.row .cmf .v small{font-family:var(--sans);color:var(--muted);font-size:16px}\n.div{height:6px;position:relative;background:linear-gradient(var(--axis),var(--axis)) center/1px 100% no-repeat}\n.div i{position:absolute;top:0;bottom:0;border-radius:3px}\n.row .tag{grid-area:tag;font-size:16px;color:var(--ink-2)}\n.row .tag b{font-weight:600}\n.hdr{display:grid;grid-template-columns:minmax(0,1.3fr) 92px 80px minmax(0,1.2fr);gap:10px;padding:0 6px 6px;font-family:var(--sans);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\n.hdr span:nth-child(3){text-align:right}\n@container (max-width:460px){\n  .row{grid-template-columns:minmax(0,1fr) 64px 76px;grid-template-areas:\"id rs d\" \"cmf cmf cmf\" \"tag tag tag\";gap:4px 8px}\n  .hdr{grid-template-columns:minmax(0,1fr) 64px 76px}\n  .hdr span:nth-child(4){display:none}\n}\n\n/* read */\n.read{display:grid;gap:10px}\n.read .item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}\n.read .item p{margin:0;max-width:65ch}\n.read .item .tk{font-family:var(--sans);font-weight:600}\n.defs{font-size:19px;color:var(--ink-2);display:grid;gap:6px;max-width:75ch}\n.defs p{margin:0}\n.defs b{color:var(--ink)}\n@media (prefers-reduced-motion:no-preference){ .row,.map .dot circle{transition:background .15s, r .15s} }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\n\u003cdiv class=\"wrap\">\n  \u003cheader>\n    \u003cdiv class=\"eyebrow\">US sectors | RS vs QQQ | \u003cspan id=\"asof\">\u003c/span>\u003c/div>\n    \u003ch1>Sector Rotation\u003c/h1>\n    \u003cdiv class=\"sample\" id=\"sample\">\u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"cols\">\n    \u003cdiv class=\"stack\">\n      \u003csection class=\"panel stack\" aria-labelledby=\"h-q\">\n        \u003ch2 id=\"h-q\">Where each sector sits\u003c/h2>\n        \u003cdiv class=\"quads\" id=\"quads\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"panel stack\" aria-labelledby=\"h-map\">\n        \u003ch2 id=\"h-map\">Rotation map\u003c/h2>\n        \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n        \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n        \u003cp class=\"caption\">Each arrow runs from RS21 five sessions ago to today; the shaded side of the dashed line is hot (60+). Biggest warmers are at the top, faint dots are the daily ranks in between. Shaded rows are rotating in: below 60 but up 10+, or just crossed 60. Tap a row for details.\u003c/p>\n      \u003c/section>\n    \u003c/div>\n\n    \u003cdiv class=\"stack\">\n      \u003csection class=\"panel stack\" aria-labelledby=\"h-flow\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n          \u003ch2 id=\"h-flow\">Heat and money flow\u003c/h2>\n          \u003cdiv class=\"sorts\" role=\"group\" aria-label=\"Sort sectors\">\n            \u003cbutton type=\"button\" id=\"s-rs\" data-k=\"rs\" aria-pressed=\"true\">Hottest\u003c/button>\n            \u003cbutton type=\"button\" id=\"s-d\" data-k=\"d\" aria-pressed=\"false\">Warming\u003c/button>\n            \u003cbutton type=\"button\" id=\"s-cmf\" data-k=\"cmf\" aria-pressed=\"false\">Money in\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"flowbox\">\n          \u003cdiv class=\"hdr\">\u003cspan>Sector\u003c/span>\u003cspan>RS21\u003c/span>\u003cspan>5d change\u003c/span>\u003cspan>CMF | money flow\u003c/span>\u003c/div>\n          \u003cdiv class=\"rows\" id=\"rows\">\u003c/div>\n        \u003c/div>\n        \u003cp class=\"caption\">CMF bar: \u003cspan style=\"color:var(--in)\">#\u003c/span> money in (right) | \u003cspan style=\"color:var(--out)\">#\u003c/span> money out (left). Super $M is OpenD large-order flow, shown where it is already pulled (\u003cspan id=\"super-count\">\u003c/span> ETFs today).\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"panel stack\" aria-labelledby=\"h-read\">\n        \u003ch2 id=\"h-read\">Today's read\u003c/h2>\n        \u003cdiv class=\"read\" id=\"read\">\u003c/div>\n      \u003c/section>\n    \u003c/div>\n  \u003c/div>\n\n  \u003csection class=\"panel stack\" aria-labelledby=\"h-def\">\n    \u003ch2 id=\"h-def\">How it's worked out\u003c/h2>\n    \u003cdiv class=\"defs\">\n      \u003cp>\u003cb>Hot / cold\u003c/b> is RS21 rank vs QQQ, 0-100. The dividing line is 60, the same as the High Conviction RS21 minimum in your heatmap script.\u003c/p>\n      \u003cp>\u003cb>Warming / cooling\u003c/b> is RS21 today minus RS21 five sessions ago. Your heatmap script already labels +/-5 or more as RISING / FALLING, so the faint band around zero is \"flat\".\u003c/p>\n      \u003cp>\u003cb>Money flow\u003c/b> is CMF over 20 days. Price above MA50 with CMF below -0.05 is \u003cb>selling into strength\u003c/b>. Price below MA50 with CMF above +0.05 is \u003cb>quiet buying\u003c/b>.\u003c/p>\n      \u003cp>\u003cb>Next step for real data:\u003c/b> the heatmap script writes all 17 ETFs with RS5/21/63, RS21 for the last 8 dates, CMF, MFI trend, % vs MA50 and OpenD Super/Big flow. This page reads it between START_DATA / END_DATA markers, the same way your desk board is plugged.\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\u003c/div>\n\n\u003c!-- START_DATA -->\n\u003cscript>\nwindow.__ROT__ = {\n  \"date\": \"2026-10-07\",\n  \"weekday\": \"Wednesday\",\n  \"asof\": \"2026-10-07 21:12 HKT\",\n  \"sample_fields\": [],\n  \"sectors\": [\n    {\n      \"etf\": \"SMH\",\n      \"sector\": \"Semiconductors\",\n      \"rs21\": 100,\n      \"rs5\": 87,\n      \"ma50\": 10.2,\n      \"cmf\": 0.098,\n      \"trend\": \"\",\n      \"super\": -5.99,\n      \"d5\": 3,\n      \"hist\": [\n        [\n          97,\n          -3\n        ],\n        [\n          97,\n          0\n        ],\n        [\n          100,\n          0\n        ],\n        [\n          97,\n          0\n        ],\n        [\n          100,\n          3\n        ]\n      ]\n    },\n    {\n      \"etf\": \"ARKG\",\n      \"sector\": \"Genomics\",\n      \"rs21\": 97,\n      \"rs5\": 3,\n      \"ma50\": 9.1,\n      \"cmf\": 0.003,\n      \"trend\": \"\",\n      \"super\": -18.05,\n      \"d5\": -3,\n      \"hist\": [\n        [\n          100,\n          10\n        ],\n        [\n          100,\n          0\n        ],\n        [\n          97,\n          0\n        ],\n        [\n          100,\n          0\n        ],\n        [\n          97,\n          -3\n        ]\n      ]\n    },\n    {\n      \"etf\": \"MAGS\",\n      \"sector\": \"Mag-7\",\n      \"rs21\": 90,\n      \"rs5\": 74,\n      \"ma50\": 6.6,\n      \"cmf\": -0.024,\n      \"trend\": \"\",\n      \"super\": -5.94,\n      \"d5\": -2,\n      \"hist\": [\n        [\n          92,\n          -5\n        ],\n        [\n          90,\n          -2\n        ],\n        [\n          90,\n          -5\n        ],\n        [\n          90,\n          -5\n        ],\n        [\n          90,\n          -2\n        ]\n      ]\n    },\n    {\n
